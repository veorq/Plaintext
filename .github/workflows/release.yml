name: Build beta release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Plaintext
        run: ./build-app.sh

      - name: Package app
        run: |
          asset="Plaintext-${GITHUB_REF_NAME}-macos-$(uname -m).zip"
          ditto -c -k --keepParent Plaintext.app "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Plaintext ${GITHUB_REF_NAME}" \
            --notes "Beta release for macOS, Windows, and Linux. The Windows build is a self-contained, unsigned 64-bit executable; Windows may show a first-launch security warning. The Linux archive requires GTK 4 and Fontconfig." \
            --prerelease \
            Plaintext-*.zip Plaintext-*.zip.sha256

  release-windows:
    needs: release-macos
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows app
        run: >
          dotnet publish Windows/Plaintext.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish

      - name: Package Windows app
        shell: pwsh
        run: |
          $asset = "Plaintext-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path "publish/Plaintext.exe" -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"

      - name: Upload Windows release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path "Plaintext-*.zip", "Plaintext-*.zip.sha256" | ForEach-Object { $_.FullName }
          gh release upload $env:GITHUB_REF_NAME $assets

  release-linux:
    needs: release-macos
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libfontconfig1-dev

      - name: Package Linux app
        run: ./build-linux.sh "$GITHUB_REF_NAME"

      - name: Upload Linux release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Plaintext-*-linux-x86_64.tar.gz Plaintext-*-linux-x86_64.tar.gz.sha256
